samples:
  directory: ./G10_allosomes/
  individual_names: [
    "NA19700", "NA19701", "NA19704", "NA19703", "NA19819", "NA19818",
    "NA19835", "NA19834", "NA19901", "NA19900", "NA19909", "NA19908",
    "NA19917", "NA19916", "NA19713", "NA19982", "NA20127", "NA20126",
    "NA20357", "NA20356"
    ]
  filename_format: "{name}_{label}.bed"
  labels: [A, B] #If this field is omitted, 'A' and 'B' will be used by default
  chromosomes: 1-22
  allosomes: [X]

models:
  model_filename: ./models/pp_px.yaml
  implicit_population: AFR
  ad_model_autosomes: DC
  ad_model_allosomes: DC

start_params: 
  tx: 8:11
  P:  0.03:0.05
  P_sex_bias: .2
  t2: 5:6

optim:
  repetitions: 2
  seed: 150
  maximum_iterations: 1000
  exclude_tracts_below_cm: 2
  fix_parameters_from_ancestry_proportions: [R, R_sex_bias]
  n_reoptimizations: 5
  rerun_optimization_on_boundaries: True

output:
  output_directory: ./output_two_pulse_sex_bias/
  verbose_log: 1
  verbose_screen: 30
  log_scale: True
