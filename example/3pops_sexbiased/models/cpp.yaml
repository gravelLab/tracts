model_name: Continuous_pulse_AFR
description: 
  Represents a population X founded with a discrete event (AFR, AMR) and continuous event (EUR).
time_units: generations
demes:
  - name: EUR
  - name: AMR
  - name: AFR
  - name: targetpop
    ancestors: [EUR, AMR, AFR]
    proportions: [REUR, RAMR,RAFR ]
    start_time: t1
    end_time: t2
    pulse_pops: [AFR, AMR]
