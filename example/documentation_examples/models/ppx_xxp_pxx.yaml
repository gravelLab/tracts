model_name: Three pulses
description:
  A demes model with flexible parameters. Represents a population X founded t1 generations ago by EUR and AMR, then subsequent AFR migration,
  then subsequent EUR migration.
time_units: generations
demes:
  - name: EUR
  - name: AMR
  - name: targetpop
    ancestors: [EUR, AMR]
    proportions: [REUR, RAMR]
    start_time: t1

pulses:
  - sources: [AFR]
    dest: targetpop
    proportions: [RAFR]
    time: t2

  - sources: [EUR]
    dest: targetpop
    proportions: [REUR2]
    time: t3