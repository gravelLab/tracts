[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "tracts"
version = "0.0.2"
license = { text = "MIT" }
authors = [
  { name="Simon Gravel", email="simon.gravel@mcgill.ca" },
]
description = "A set of classes and definitions used to model migration histories based on ancestry tracts in admixed individuals. Time-dependent gene-flow from multiple populations can be modeled."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/sgravel/tracts/blob/devel"
"Bug Tracker" = "https://github.com/sgravel/tracts/issues"

[tool.pytest.ini_options]
filterwarnings = [
    # Environment-only: fires when a duplicate (system + venv) Matplotlib install is
    # present; not caused by tracts and does not affect any functionality tracts uses.
    "ignore:Unable to import Axes3D:UserWarning",
    # Expected: tracts.legacy is intentionally deprecated and warns once on import,
    # purely from being re-exported at the top level for backwards compatibility.
    "ignore:tracts.legacy is deprecated:DeprecationWarning",
    # Third-party: Matplotlib's own math-text renderer (used when plotting output figures)
    # calls pyparsing APIs that pyparsing itself has since deprecated; not caused by tracts
    # and only fixable by upgrading the installed Matplotlib/pyparsing versions.
    # (Registered in conftest.py instead of here: pyparsing's deprecation-warning class has
    # moved between top-level and submodule locations across versions, and resolving a
    # nonexistent dotted path in this static list crashes pytest collection entirely rather
    # than just skipping the filter.)
    # Expected on newer SciPy (whose COBYLA implementation validates maxfun >= num_vars + 2):
    # the test driver YAMLs and core.py test fixtures deliberately use very low
    # maxiter/maximum_iterations values (as low as 2) to keep the test suite fast, not to
    # reach real convergence. SciPy auto-corrects and proceeds; nothing is left unoptimized
    # as a result that the tests rely on.
    "ignore:.*Invalid MAXFUN.*:UserWarning",
]
